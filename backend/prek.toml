[[repos]]
repo = "local"

[[repos.hooks]]
id = "golangci-lint-fmt"
name = "golangci-lint fmt"
entry = "mise exec -- golangci-lint fmt"
language = "system"
types = ["go"]
pass_filenames = false
require_serial = true
priority = 0

[[repos.hooks]]
id = "golangci-lint"
name = "golangci-lint"
entry = "mise exec -- golangci-lint run --fix"
language = "system"
types = ["go"]
pass_filenames = false
require_serial = true
priority = 10

[[repos.hooks]]
id = "go-mod-tidy"
name = "go mod tidy"
entry = "go mod tidy"
language = "system"
files = '(\.go|go\.mod|go\.sum)$'
pass_filenames = false
priority = 20

[[repos.hooks]]
id = "go-test"
name = "go test"
entry = "go test -race ./..."
language = "system"
types = ["go"]
pass_filenames = false
stages = ["pre-push"]
priority = 30
