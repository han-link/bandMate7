apiVersion: v1
kind: Pod
metadata:
  name: {{ include "bandmate7.fullname" . }}-test-backend
  labels:
    {{- include "bandmate7.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: health
      image: {{ .Values.tests.image | quote }}
      command: ["sh", "-c"]
      args:
        - |
          set -e
          url="http://{{ include "bandmate7.fullname" . }}-backend:{{ .Values.backend.port }}{{ .Values.backend.healthPath }}"
          echo "GET $url"
          body=$(wget -qO- "$url")
          echo "$body"
          echo "$body" | grep -q '"status"' || { echo "unexpected health payload"; exit 1; }
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 32Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
{{- if .Values.web.enabled }}
---
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "bandmate7.fullname" . }}-test-web
  labels:
    {{- include "bandmate7.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-weight": "2"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: index
      image: {{ .Values.tests.image | quote }}
      command: ["sh", "-c"]
      args:
        - |
          set -e
          base="http://{{ include "bandmate7.fullname" . }}-web:80"
          echo "GET $base{{ .Values.web.healthPath }}"
          wget -qO- "$base{{ .Values.web.healthPath }}"
          echo "GET $base/"
          wget -qO- "$base/" | head -c 200
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 32Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
{{- end }}
