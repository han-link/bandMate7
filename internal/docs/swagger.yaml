        type: string
      id:
        type: string
      role:
        $ref: '#/definitions/model.UserRole'
      type:
        $ref: '#/definitions/model.ResourceType'
      updatedAt:
        type: string
    type: object
  model.ResourceType:
    enum:
    - image
    - video
    - audio
    - document
    type: string
    x-enum-varnames:
    - ResourceTypeImage
    - ResourceTypeVideo
    - ResourceTypeAudio
    - ResourceTypeDocument
  model.UserRole:
    properties:
      createdAt:
        type: string
      id:
        type: string
      name:
        type: string
      updatedAt:
        type: string
    type: object
