definitions:
  model.Performance:
    properties:
      bpm:
        type: integer
      cover:
        $ref: '#/definitions/model.Resource'
      createdAt:
        type: string
      id:
        type: string
      name:
        type: string
      updatedAt:
        type: string
    type: object
  model.Resource:
    properties:
      createdAt:
        type: string
